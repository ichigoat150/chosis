
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-jeu - Chosis Toi</title>
    <style>
        body {
            margin: 0;
            padding: 30px 15px;
            background: #f5f5f3;
            color: #222;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .jeu {
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            background: #292929;
            color: white;
            border: none;
            cursor: pointer;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="jeu">
        <h1>🎮 Mini-jeu</h1>
        <p>Clique sur le bouton pour gagner des points !</p>
        <p id="score">Score : 0</p>
        <button id="bouton">Jouer</button>
    </div>

    <script>
        let score = 0;

        document.getElementById("bouton").addEventListener("click", () => {
            score++;
            document.getElementById("score").textContent = "Score : " + score;
        });
    </script>
</body>
</html>
