

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111318">
    <title>Chosis Toi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <h1>Chosis Toi</h1>
        <p>Ta collection, tes jeux.</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Bienvenue</h2>
            <p>Retrouve tes jeux au même endroit.</p>
        </section>

        <section class="library">
            <h2 id="section-title">Ma bibliothèque</h2>

            <input
                type="search"
                id="search"
                placeholder="Rechercher un jeu..."
                aria-label="Rechercher un jeu"
            >

            <div id="games" class="games"></div>

            <section id="game-details" class="game-details" hidden>
                <button id="back-button" type="button">← Retour</button>
                <img id="detail-image" src="" alt="">
                <h2 id="detail-name"></h2>
                <p id="detail-console"></p>
                <button id="play-button" type="button">Jouer</button>
                <div id="zone-jeu" hidden>
    <iframe
        id="jeu-frame"
        src=""
        title="Jeu"
        width="100%"
        height="500"
        style="border: 0;">
    </iframe>
</div>
            </section>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigation principale">
        <button class="nav-button active" data-page="home" type="button">
            🏠 <span>Accueil</span>
        </button>
        <button class="nav-button" data-page="favorites" type="button">
            ❤️ <span>Favoris</span>
        </button>
        <button class="nav-button" data-page="profile" type="button">
            👤 <span>Profil</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
