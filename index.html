
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111318">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Chosis Toi : ta collection, tes jeux.">
    <title>Chosis Toi</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <span class="logo" aria-hidden="true">🎮</span>
            <div>
                <h1>Chosis Toi</h1>
                <p>Ta collection, tes jeux.</p>
            </div>
        </div>
    </header>

    <main>
        <section id="welcome" class="welcome">
            <div class="hero">
                <h2>Bienvenue</h2>
                <p>Retrouve tes jeux au même endroit.</p>
            </div>
        </section>

        <!-- Vue liste : accueil, favoris, profil -->
        <section id="library" class="library">
            <h2 id="section-title">Ma bibliothèque</h2>

            <input
                type="search"
                id="search"
                placeholder="Rechercher un jeu ou une console..."
                aria-label="Rechercher un jeu"
                autocomplete="off"
            >

            <div id="games" class="games"></div>
        </section>

        <!-- Vue détail d'un jeu -->
        <section id="detail-view" class="library" hidden>
            <div id="game-details" class="game-details">
                <button id="back-button" type="button">← Retour</button>
                <img id="detail-image" alt="">
                <h2 id="detail-name"></h2>
                <p id="detail-console"></p>
                <button id="play-button" type="button">Jouer</button>

                <div id="zone-jeu" hidden>
                    <iframe
                        id="jeu-frame"
                        class="jeu-frame"
                        title="Jeu"
                        width="100%"
                        height="500"
                        sandbox="allow-scripts allow-same-origin"
                        allow="fullscreen">
                    </iframe>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">Chosis Toi · fait maison</footer>

    <nav class="bottom-nav" aria-label="Navigation principale">
        <button class="nav-button active" data-page="home" type="button">
            🏠 <span>Accueil</span>
        </button>
        <button class="nav-button" data-page="favorites" type="button">
            ❤️ <span>Favoris</span>
        </button>
        <button class="nav-button" data-page="profile" type="button">
            👤 <span>Profil</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
