<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e26"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <pattern id="grille" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="300" height="400" fill="url(#fond)"/>
  <rect width="300" height="400" fill="url(#grille)"/>
  <rect x="6" y="6" width="288" height="388" rx="10" fill="none" stroke="#3ecf6b" stroke-opacity="0.5" stroke-width="3"/>

  <!-- Titre -->
  <text x="150" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#7CFC9A" letter-spacing="4">SNAKE</text>
  <text x="150" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.6" letter-spacing="3">JEU CLASSIQUE</text>

  <!-- Serpent (segments carrés) -->
  <g fill="#3ecf6b">
    <rect x="50"  y="300" width="23" height="23" rx="3"/>
    <rect x="75"  y="300" width="23" height="23" rx="3"/>
    <rect x="100" y="300" width="23" height="23" rx="3"/>
    <rect x="125" y="300" width="23" height="23" rx="3"/>
    <rect x="125" y="275" width="23" height="23" rx="3"/>
    <rect x="125" y="250" width="23" height="23" rx="3"/>
    <rect x="125" y="225" width="23" height="23" rx="3"/>
    <rect x="150" y="225" width="23" height="23" rx="3"/>
    <rect x="175" y="225" width="23" height="23" rx="3"/>
    <rect x="175" y="200" width="23" height="23" rx="3"/>
    <rect x="175" y="175" width="23" height="23" rx="3"/>
  </g>
  <!-- Tête -->
  <rect x="175" y="150" width="23" height="23" rx="4" fill="#7CFC9A"/>
  <circle cx="182" cy="159" r="2.5" fill="#0d0f14"/>
  <circle cx="191" cy="159" r="2.5" fill="#0d0f14"/>
  <!-- Langue -->
  <path d="M186.5 150 V140 M186.5 140 l-4 -5 M186.5 140 l4 -5" stroke="#ff5a5f" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Pomme -->
