  <path d="M237 151 q3 -7 8 -8" stroke="#7CFC9A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Bas de pochette -->
  <text x="150" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">MANGE · GRANDIS · SURVIS</text>
